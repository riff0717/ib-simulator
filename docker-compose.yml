version: '3.8'
services:
  web:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    environment: {}
    restart: unless-stopped
    networks:
      - webnet

  frontend:
    image: node:18
    working_dir: /app
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - webnet
    restart: unless-stopped

networks:
  webnet:
    driver: bridge

# Usage:
#  docker compose up --build
# Visit http://localhost:8080/hoi4-innova.html
# Frontend dev server: http://localhost:5173/
