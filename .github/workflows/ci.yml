name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build docker images (Makefile)
        run: make build

      - name: Run tests if defined
        run: |
          if [ -f Makefile ] && grep -q "^test:" Makefile 2>/dev/null; then
            make test
          else
            echo "No test target in Makefile, skipping tests"
          fi

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages content
        run: |
          # Copy repository files to public/, excluding repository metadata and CI directory
          mkdir -p public
          rsync -av --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='venv' --exclude='__pycache__' --exclude='.gitignore' ./ public/ || true

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
