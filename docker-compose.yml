version: '3.8'
services:
  web:
    image: nginx:stable-alpine
    ports:
      - "8081:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    environment: {}
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

# Usage:
#  docker compose up --build
# Visit http://localhost:8080/hoi4-innova.html
